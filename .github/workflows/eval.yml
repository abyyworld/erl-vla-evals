name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate checkpoint path or registry id to gate"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.6.9
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
      - run: pytest -q --cov=policy_evals --cov-report=term-missing

  suite-sanity:
    # A benchmark whose trivial baselines score well is measuring the
    # environment, not the policy. Every number this repo produces is worthless
    # if these three checks stop holding, so they gate the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Trivial baselines must fail, the oracle must succeed
        run: |
          policy-evals run zero     --tag zero
          policy-evals run random   --tag random
          policy-evals run scripted --tag scripted
          python - <<'PY'
          import json, sys
          def rate(tag):
              path = f"results/manipulation_v1__{tag}.json"
              return json.load(open(path))["overall_success_rate"]

          zero, random_, oracle = rate("zero"), rate("random"), rate("scripted")
          print(f"zero={zero:.1%} random={random_:.1%} oracle={oracle:.1%}")

          problems = []
          if zero > 0.01:
              problems.append(f"a do-nothing policy scores {zero:.1%} — goals are too close")
          if random_ > 0.05:
              problems.append(f"a random policy scores {random_:.1%} — success is too easy to stumble into")
          if oracle < 0.95:
              problems.append(f"the oracle only scores {oracle:.1%} — tasks are unsolvable or the step budget is too tight")
          if problems:
              sys.exit("FAIL: " + "; ".join(problems))
          PY

      - name: The gate must catch an injected regression
        # If this stops failing, the gate has stopped working and every future
        # PASS is meaningless.
        run: |
          policy-evals run scripted+noise:0.12 --tag degraded
          if policy-evals compare \
              results/manipulation_v1__scripted.json \
              results/manipulation_v1__degraded.json \
              --tolerance 0.02 --out results/regression_check.md; then
            echo "FAIL: the gate passed a policy degraded from 100% to ~55%"
            exit 1
          fi
          echo "gate correctly rejected the degraded policy"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Suite sanity"
            echo
            cat results/regression_check.md 2>/dev/null || echo "no comparison produced"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/
          retention-days: 14

  gate-candidate:
    # Manual promotion gate: evaluate a candidate against the registered
    # production checkpoint on identical seeds and refuse a regression.
    if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,torch]'

      - name: Gate
        run: policy-evals gate "${{ inputs.candidate }}" --tolerance 0.02

      - name: Report
        if: always()
        run: cat results/gate.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: results/
